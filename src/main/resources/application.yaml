spring:
  application:
    name: transaction-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/transactions
    username: tracker
    password: tracker
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates, never generates DDL.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
